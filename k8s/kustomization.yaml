apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# Point this at your own registry mirror for air-gapped / restricted
# clusters, e.g.:
#   kustomize edit set image temporal-docs-watermarked=registry.internal/temporal-docs-watermarked:latest
images:
  - name: temporal-docs-watermarked
    newName: temporal-docs-watermarked
    newTag: latest
