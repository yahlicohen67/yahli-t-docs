apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-docs-watermarked
  labels:
    app: temporal-docs-watermarked
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal-docs-watermarked
  template:
    metadata:
      labels:
        app: temporal-docs-watermarked
    spec:
      # No public internet access is required at runtime: this serves the
      # pre-built static site only. Point `image` at your own registry
      # mirror if the cluster nodes can't reach docker.io directly.
      containers:
        - name: nginx
          image: temporal-docs-watermarked:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
